[project]
name = "workx"
version = "0.1.0"
description = "WorkX control plane: modular monolith with trusted gateway entrypoints"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "joserfc>=1.0",
  "python-multipart>=0.0.18",
  "cryptography>=43",
  # Artifact validation and previews (P-06)
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pypdf>=5.0",
]

[project.optional-dependencies]
# Production sandbox provider (domains/runtime/sandbox.py: E2BProvider).
e2b = ["e2b>=2.0"]
# S3-compatible object storage (platform/storage.py: S3Store).
s3 = ["boto3>=1.35"]

[project.scripts]
workx = "workx.entrypoints.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workx"]
