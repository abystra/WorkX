[project]
name = "workx-runner"
version = "0.1.0"
description = "WorkX Runner: runs one Attempt inside the sandbox and speaks the runner protocol (Part 4 §6)"
requires-python = ">=3.11"
# Deliberately small and independent of services/workx (Part 12 §3).
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
sdk = ["claude-agent-sdk>=0.2"]

[project.scripts]
workx-runner = "workx_runner.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workx_runner"]
